[package]
name = "nyx-agentd"
description = "Nyx Agent Manager: owns agent sessions and their terminals, outliving the app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-agentd"
path = "src/main.rs"

[dependencies]
nyx-agents-proto = { path = "../../crates/nyx-agents-proto" }
nyx-agents-core = { path = "../../crates/nyx-agents-core" }
nyx-term.workspace = true
nyx-pty.workspace = true
libc.workspace = true
serde_json.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
