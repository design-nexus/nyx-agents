name: Agents tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust zig gtk4 pango fontconfig curl
      - uses: actions/checkout@v4
      - run: tools/fetch-libghostty-vt.sh
      - run: cargo test --workspace --locked
